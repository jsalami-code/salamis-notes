<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<title>SALAMI&#39;s Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SALAMI's Notes">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <section id="listScreen" class="screen on">
    <header class="bar">
      <h1>SALAMI&#39;s Notes <span class="sub" id="countSub"></span></h1>
      <button class="icon" id="sync" title="Sync with OneDrive">&#x2601;</button>
      <button class="icon" id="settings" title="Sync settings">&#x2699;</button>
    </header>
    <div class="filters">
      <input id="q" type="search" placeholder="Search every note" autocomplete="off" enterkeyhint="search">
      <select id="kind" aria-label="Category">
        <option value="all">All</option>
        <option value="today">Today's List</option>
        <option value="todo">To-do lists</option>
        <option value="tracker">Task trackers</option>
        <option value="monthly">Monthly lists</option>
        <option value="note">Notes</option>
      </select>
    </div>
    <div id="syncLine" class="syncline" hidden></div>
    <div id="list"></div>
    <button id="add" title="New">+</button>
  </section>

  <section id="noteScreen" class="screen off">
    <header class="bar" id="noteBar">
      <button class="icon" id="back">&#x2190;</button>
      <h1 id="noteTitle">&nbsp;<span class="sub" id="noteSub"></span></h1>
      <button class="icon" id="rename" title="Rename">&#x270e;</button>
      <button class="icon" id="colour" title="Colour">&#x25d1;</button>
      <button class="icon" id="del" title="Delete">&#x267b;</button>
    </header>
    <div id="noteBody"><div class="ph">Pick a note</div></div>
  </section>

</div>

<div id="sheet"><div class="inner">
  <button data-new="note"><span class="sw" style="background:#F7E06A"></span> New note</button>
  <button data-new="todo"><span class="sw" style="background:#AEE09F"></span> New to-do list</button>
  <button data-new="today"><span class="sw" style="background:#AEE09F"></span> Today's List</button>
  <button data-new="tracker"><span class="sw" style="background:#A4D3FA"></span> New task tracker</button>
  <button data-new="monthly"><span class="sw" style="background:#CBB8FF"></span> New monthly activity list</button>
</div></div>

<div id="cfg" class="sheet"><div class="inner pane">
  <h2>OneDrive sync</h2>
  <p id="cfgWho" class="hint"></p>
  <label>Client ID <small>from your Azure app registration</small>
    <input id="cfgId" placeholder="00000000-0000-0000-0000-000000000000" autocomplete="off" spellcheck="false"></label>
  <label>Notes folder in OneDrive
    <input id="cfgPath" placeholder="Personal Development/StickyNotes" autocomplete="off" spellcheck="false"></label>
  <p class="hint">Redirect URI to register in Azure: <code id="cfgRedirect"></code></p>
  <div class="cfgRow">
    <button id="cfgSave" class="primary">Save</button>
    <button id="cfgIn">Sign in</button>
    <button id="cfgCheck">Check folder</button>
    <button id="cfgOut">Sign out</button>
    <button id="cfgSeed">Re-read local folder</button>
    <button id="cfgClose">Close</button>
  </div>
  <h2 style="margin-top:18px">Alarms</h2>
  <p class="hint" id="cfgNotif"></p>
  <div class="cfgRow">
    <button id="cfgAsk">Allow notifications</button>
    <button id="cfgInstall" hidden>Install app</button>
  </div>
  <p id="cfgMsg" class="hint"></p>
</div></div>

<script type="module" src="app.js"></script>
</body>
</html>
